<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Secret 🤫</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="page page-2">
  <main class="center-wrap">
    <section class="glass secret-card">
      <div class="lock">🔐</div>
      <p class="eyebrow">TOP SECRET</p>
      <h1>Okay... prove you're the birthday person 😏</h1>
      <p>Enter the secret passcode to unlock your surprise.</p>
      <input id="code" class="code-input" maxlength="4" inputmode="numeric" placeholder="••••" autocomplete="off">
      <button class="btn primary" onclick="unlock()">Unlock ✨</button>
      <p id="error" class="error"></p>
      <button class="back-btn" onclick="goBack()">← Go Back</button>
    </section>
  </main>
  <script src="js/app.js"></script>
</body>
</html>
