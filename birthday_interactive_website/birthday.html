<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Birthday Just For You 🎂</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="page page-6">
  <div class="floating-hearts"></div>
  <main class="memory-hero">
    <div class="photo-frame">
      <img src="assets/images/page6-main.jpg" alt="Birthday memory" onerror="this.src='https://picsum.photos/seed/birthday-main/900/650'">
    </div>
    <section class="glass birthday-message">
      <p class="eyebrow">TODAY IS ALL ABOUT YOU</p>
      <h1>Happy Birthday, Beautiful! 🎂💖</h1>
      <p>
        Today isn't just another date on the calendar. It's a reminder that
        the world became a little brighter because you were born.
      </p>
      <p class="quote">“May your smile stay bright, your heart stay happy, and every dream find its way to you.”</p>
      <button class="btn primary" onclick="go('memories.html')">Open Our Memories 📸</button>
      <button class="back-btn" onclick="goBack()">← Go Back</button>
    </section>
  </main>
  <script src="js/app.js"></script>
</body>
</html>
